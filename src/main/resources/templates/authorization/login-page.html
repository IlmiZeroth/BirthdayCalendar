<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <title>LOGIN FORM </title>
</head>
<body>
<div th:if="${param.error}">
    Неверный логин и пароль!
</div>
<div th:if="${param.logout}">
    Вы вышли из аккаунта.
</div>
<div th:if="${param.registered}">
    Вы успешно зарегистрировались!
</div>
<form th:action="@{/login}" method="post">
    <div><label> User Name: <input type="text" name="username"/> </label></div>
    <div><label> Password: <input type="password" name="password"/> </label></div>
    <div><input type="submit" value="Авторизоваться"/></div>
</form>
</body>
<div class = "footer-link-container">
    <span class = "footer-link-container__text"> Ещё не зарегистрирован? <a href = "/register" class = "footer-link-container__link">Зарегистрироваться</a></span>
</div>
</html>
